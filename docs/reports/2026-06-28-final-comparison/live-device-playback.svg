<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Live API-to-device playback benchmark</title>
  <desc id="desc">Realtime live fixture with first local speaker playback callback timing.</desc>
  <rect width="980" height="350" fill="#ffffff"/>
  <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Full API-to-device rerun: playback is not the bottleneck</text>
  <text x="28" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">8 live macOS say fixtures, server_vad 200 ms, 20 ms input chunk, play_output=True.</text>
  <line x1="290" y1="278" x2="895" y2="278" stroke="#cbd5e1"/>
  <text x="290" y="300" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="420" y="300" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">500</text>
  <text x="558" y="300" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">1000</text>
  <text x="695" y="300" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">1500</text>
  <text x="833" y="300" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">2000 ms</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="28" y="118" fill="#111827">Device playback p50</text>
    <rect x="290" y="102" width="350.6" height="22" rx="3" fill="#22c55e"/>
    <line x1="676" y1="96" x2="676" y2="132" stroke="#15803d" stroke-width="3"/>
    <text x="652" y="118" fill="#14532d">1275.0 ms</text>
    <text x="688" y="118" fill="#14532d">rep max 1403.3 ms</text>

    <text x="28" y="162" fill="#111827">API first-audio p50</text>
    <rect x="290" y="146" width="348.7" height="22" rx="3" fill="#84cc16"/>
    <line x1="673" y1="140" x2="673" y2="176" stroke="#3f6212" stroke-width="3"/>
    <text x="650" y="162" fill="#365314">1267.9 ms</text>
    <text x="685" y="162" fill="#365314">rep max 1393.5 ms</text>

    <text x="28" y="206" fill="#111827">VAD wait p50</text>
    <rect x="290" y="190" width="140.9" height="22" rx="3" fill="#93c5fd"/>
    <line x1="441" y1="184" x2="441" y2="220" stroke="#2563eb" stroke-width="3"/>
    <text x="443" y="206" fill="#1e3a8a">512.3 ms</text>

    <text x="28" y="250" fill="#111827">API delta to playback p50</text>
    <rect x="290" y="234" width="1.8" height="22" rx="2" fill="#0f766e"/>
    <line x1="293" y1="228" x2="293" y2="264" stroke="#115e59" stroke-width="3"/>
    <text x="304" y="250" fill="#134e4a">6.5 ms, rep max 9.8 ms</text>
  </g>
  <text x="28" y="328" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">Conclusion: local playback adds less than one 10 ms callback block; remaining latency sits before the first API audio delta.</text>
</svg>
