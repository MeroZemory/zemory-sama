<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Optimization stack</title>
  <desc id="desc">Layered latency optimizations applied to zemory-sama.</desc>
  <rect width="980" height="360" fill="#ffffff"/>
  <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Current fast path stack</text>
  <text x="28" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">Each layer removes a distinct source of perceived voice latency.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="52" y="108" width="160" height="82" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="72" y="136" font-size="14" font-weight="700" fill="#14532d">Realtime audio</text>
    <text x="72" y="160" font-size="12" fill="#166534">gpt-realtime-2</text>
    <text x="72" y="178" font-size="12" fill="#166534">audio in/out</text>

    <line x1="212" y1="149" x2="262" y2="149" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="262" y="108" width="160" height="82" rx="8" fill="#ecfccb" stroke="#65a30d"/>
    <text x="282" y="136" font-size="14" font-weight="700" fill="#365314">Turn end</text>
    <text x="282" y="160" font-size="12" fill="#4d7c0f">server_vad</text>
    <text x="282" y="178" font-size="12" fill="#4d7c0f">200 ms stable</text>

    <line x1="422" y1="149" x2="472" y2="149" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="472" y="108" width="160" height="82" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="492" y="136" font-size="14" font-weight="700" fill="#075985">Measurement</text>
    <text x="492" y="160" font-size="12" fill="#0369a1">p50 + rep max</text>
    <text x="492" y="178" font-size="12" fill="#0369a1">outliers retained</text>

    <line x1="632" y1="149" x2="682" y2="149" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="682" y="108" width="160" height="82" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="702" y="136" font-size="14" font-weight="700" fill="#78350f">Playback</text>
    <text x="702" y="160" font-size="12" fill="#92400e">10 ms callback</text>
    <text x="702" y="178" font-size="12" fill="#92400e">API->play p50 6.5 ms</text>

    <rect x="132" y="238" width="220" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="154" y="266" font-size="14" font-weight="700" fill="#334155">Input streaming</text>
    <text x="154" y="290" font-size="12" fill="#475569">20 ms kept after sweep</text>

    <rect x="380" y="238" width="220" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="402" y="266" font-size="14" font-weight="700" fill="#334155">Device I/O</text>
    <text x="402" y="290" font-size="12" fill="#475569">sounddevice latency="low"</text>

    <rect x="628" y="238" width="220" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="650" y="266" font-size="14" font-weight="700" fill="#334155">Still open</text>
    <text x="650" y="290" font-size="12" fill="#475569">endpoint anticipation</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
