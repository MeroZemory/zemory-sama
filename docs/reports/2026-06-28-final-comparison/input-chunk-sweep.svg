<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Input chunk sweep</title>
  <desc id="desc">Comparison of 20 ms and 10 ms realtime input chunk duration benchmark results.</desc>
  <rect width="980" height="330" fill="#ffffff"/>
  <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Input chunk sweep: 20 ms remains faster</text>
  <text x="28" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">Lowering input chunks to 10 ms did not improve the n8 comparison; it increased both p50 and representative max.</text>
  <line x1="250" y1="268" x2="890" y2="268" stroke="#cbd5e1"/>
  <text x="250" y="290" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="407" y="290" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">500</text>
  <text x="570" y="290" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">1000</text>
  <text x="733" y="290" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">1500 ms</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="28" y="116" fill="#111827">20 ms n4 probe</text>
    <rect x="250" y="100" width="335" height="20" rx="3" fill="#93c5fd"/>
    <line x1="870" y1="96" x2="870" y2="124" stroke="#2563eb" stroke-width="3"/>
    <text x="594" y="115" fill="#1e3a8a">p50 1064 ms</text>
    <text x="772" y="139" fill="#1e3a8a">tail 1971 ms</text>

    <text x="28" y="156" fill="#111827">10 ms n4 probe</text>
    <rect x="250" y="140" width="362" height="20" rx="3" fill="#bae6fd"/>
    <line x1="670" y1="136" x2="670" y2="164" stroke="#0284c7" stroke-width="3"/>
    <text x="621" y="155" fill="#075985">p50 1150 ms</text>
    <text x="682" y="155" fill="#075985">tail 1335 ms</text>

    <text x="28" y="196" fill="#111827">20 ms n8</text>
    <rect x="250" y="180" width="371" height="20" rx="3" fill="#22c55e"/>
    <line x1="688" y1="176" x2="688" y2="204" stroke="#15803d" stroke-width="3"/>
    <text x="630" y="195" fill="#14532d">p50 1180 ms</text>
    <text x="700" y="195" fill="#14532d">tail 1375 ms, kept</text>

    <text x="28" y="236" fill="#111827">10 ms n8</text>
    <rect x="250" y="220" width="380" height="20" rx="3" fill="#f97316"/>
    <line x1="823" y1="216" x2="823" y2="244" stroke="#c2410c" stroke-width="3"/>
    <text x="639" y="235" fill="#7c2d12">p50 1206 ms</text>
    <text x="835" y="235" fill="#7c2d12">tail 1811 ms</text>
  </g>
</svg>
