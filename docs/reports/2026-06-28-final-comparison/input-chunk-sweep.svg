<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Input chunk sweep</title>
  <desc id="desc">Comparison of 20 ms and 10 ms realtime input chunk duration benchmark results.</desc>
  <rect width="1200" height="400" fill="#ffffff"/>
  <text x="32" y="44" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Input chunk sweep: 20 ms remains the default</text>
  <text x="32" y="70" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Lowering input chunks to 10 ms did not improve the n8 comparison; it increased p50 and representative max.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="32" y="108" fill="#475569">Candidate</text>
    <text x="330" y="108" fill="#475569">0</text>
    <text x="492" y="108" fill="#475569">500</text>
    <text x="654" y="108" fill="#475569">1000</text>
    <text x="816" y="108" fill="#475569">1500</text>
    <text x="978" y="108" fill="#475569">2000 ms</text>
    <text x="1040" y="108" fill="#475569">Decision</text>
    <line x1="330" y1="118" x2="980" y2="118" stroke="#cbd5e1"/>
  </g>

  <g stroke="#eef2f7" stroke-width="1">
    <line x1="492" y1="122" x2="492" y2="312"/>
    <line x1="654" y1="122" x2="654" y2="312"/>
    <line x1="816" y1="122" x2="816" y2="312"/>
    <line x1="978" y1="122" x2="978" y2="312"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <text x="32" y="154" fill="#111827">20 ms n4 probe</text>
    <rect x="330" y="138" width="345" height="22" rx="3" fill="#93c5fd"/>
    <line x1="971" y1="134" x2="971" y2="164" stroke="#2563eb" stroke-width="3"/>
    <text x="1040" y="154" fill="#1e3a8a">p50 1064, rep 1971</text>

    <text x="32" y="202" fill="#111827">10 ms n4 probe</text>
    <rect x="330" y="186" width="374" height="22" rx="3" fill="#bae6fd"/>
    <line x1="764" y1="182" x2="764" y2="212" stroke="#0284c7" stroke-width="3"/>
    <text x="1040" y="202" fill="#075985">p50 1150, rep 1335</text>

    <text x="32" y="250" fill="#111827">20 ms n8</text>
    <rect x="330" y="234" width="383" height="22" rx="3" fill="#15803d" stroke="#052e16" stroke-width="2"/>
    <line x1="777" y1="230" x2="777" y2="260" stroke="#15803d" stroke-width="3"/>
    <text x="1040" y="250" fill="#14532d">p50 1180, rep 1375, kept</text>

    <text x="32" y="298" fill="#111827">10 ms n8</text>
    <rect x="330" y="282" width="392" height="22" rx="3" fill="#f97316"/>
    <line x1="918" y1="278" x2="918" y2="308" stroke="#c2410c" stroke-width="3"/>
    <text x="1040" y="298" fill="#7c2d12">p50 1206, rep 1811, rejected</text>
  </g>

  <text x="32" y="362" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Decision: smaller mic chunks did not reduce turn latency in this harness, so the simpler 20 ms default stays.</text>
</svg>
