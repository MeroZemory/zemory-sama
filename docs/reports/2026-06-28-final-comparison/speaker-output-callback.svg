<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Speaker output callback benchmark</title>
  <desc id="desc">Local SpeakerStream queue to first playback callback latency with a 10 ms output callback block.</desc>
  <rect width="980" height="320" fill="#ffffff"/>
  <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Speaker output callback: 10 ms block verified</text>
  <text x="28" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">24 local samples. Metric is queue insertion to first output callback that consumes non-zero PCM.</text>
  <line x1="290" y1="254" x2="870" y2="254" stroke="#cbd5e1"/>
  <text x="290" y="276" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="405" y="276" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">2</text>
  <text x="520" y="276" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">4</text>
  <text x="635" y="276" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">6</text>
  <text x="750" y="276" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">8</text>
  <text x="858" y="276" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">10 ms</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="28" y="118" fill="#111827">Queue to playback callback p50</text>
    <rect x="290" y="102" width="429.4" height="22" rx="3" fill="#22c55e"/>
    <line x1="870" y1="96" x2="870" y2="132" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="730" y="118" fill="#14532d">7.404 ms</text>
    <text x="878" y="118" fill="#475569">10 ms block</text>

    <text x="28" y="160" fill="#111827">Queue to playback representative max</text>
    <rect x="290" y="144" width="482.9" height="22" rx="3" fill="#84cc16"/>
    <line x1="870" y1="138" x2="870" y2="174" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="784" y="160" fill="#365314">8.326 ms</text>

    <text x="28" y="202" fill="#111827">Queue to speaker buffer p50</text>
    <rect x="290" y="186" width="3.2" height="22" rx="2" fill="#38bdf8"/>
    <text x="304" y="202" fill="#075985">0.056 ms</text>

    <text x="28" y="244" fill="#111827">Speaker buffer to callback p50</text>
    <rect x="290" y="228" width="422.8" height="22" rx="3" fill="#0f766e"/>
    <text x="724" y="244" fill="#134e4a">7.289 ms</text>
  </g>
  <text x="28" y="300" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">Result: no extreme outliers. The local playback wait stays within the 10 ms callback envelope.</text>
</svg>
