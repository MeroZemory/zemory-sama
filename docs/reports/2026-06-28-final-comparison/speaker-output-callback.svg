<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="speaker_output_callback_title speaker_output_callback_desc">
  <title id="speaker_output_callback_title">Speaker output callback benchmark</title>
  <desc id="speaker_output_callback_desc">Local SpeakerStream queue to first playback callback latency with a 10 ms output callback block.</desc>
  <rect width="1200" height="370" fill="#ffffff"/>
  <text x="32" y="44" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Speaker output callback: 10 ms block verified</text>
  <text x="32" y="70" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">24 local samples. Metric is queue insertion to first output callback that consumes non-zero PCM.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="32" y="108" fill="#475569">Metric</text>
    <text x="360" y="108" fill="#475569">0</text>
    <text x="480" y="108" fill="#475569">2</text>
    <text x="600" y="108" fill="#475569">4</text>
    <text x="720" y="108" fill="#475569">6</text>
    <text x="840" y="108" fill="#475569">8</text>
    <text x="960" y="108" fill="#475569">10 ms block</text>
    <text x="1040" y="108" fill="#475569">Result</text>
    <line x1="360" y1="118" x2="960" y2="118" stroke="#cbd5e1"/>
    <line x1="960" y1="126" x2="960" y2="286" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  </g>

  <g stroke="#eef2f7" stroke-width="1">
    <line x1="480" y1="122" x2="480" y2="314"/>
    <line x1="600" y1="122" x2="600" y2="314"/>
    <line x1="720" y1="122" x2="720" y2="314"/>
    <line x1="840" y1="122" x2="840" y2="314"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <text x="32" y="154" fill="#111827">Queue to playback callback p50</text>
    <rect x="360" y="138" width="444" height="22" rx="3" fill="#22c55e"/>
    <text x="1040" y="154" fill="#14532d">7.404 ms</text>

    <text x="32" y="204" fill="#111827">Queue to playback representative max</text>
    <rect x="360" y="188" width="500" height="22" rx="3" fill="#84cc16"/>
    <text x="1040" y="204" fill="#365314">8.326 ms</text>

    <text x="32" y="254" fill="#111827">Queue to speaker buffer p50</text>
    <rect x="360" y="238" width="4" height="22" rx="2" fill="#38bdf8"/>
    <text x="1040" y="254" fill="#075985">0.056 ms</text>

    <text x="32" y="304" fill="#111827">Speaker buffer to callback p50</text>
    <rect x="360" y="288" width="437" height="22" rx="3" fill="#0f766e"/>
    <text x="1040" y="304" fill="#134e4a">7.289 ms</text>
  </g>

  <text x="32" y="344" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Result: local playback wait stays within the 10 ms callback envelope and is not the current bottleneck.</text>
</svg>
