<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="forced_commit_upper_bound_title forced_commit_upper_bound_desc">
  <title id="forced_commit_upper_bound_title">Forced commit upper bound</title>
  <desc id="forced_commit_upper_bound_desc">Comparison of server VAD full device playback and exact endpoint forced commit playback.</desc>
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="32" y="44" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Endpoint upper bound: exact commit saves about 318 ms p50</text>
  <text x="32" y="70" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Both runs use 8 live fixtures, 20 ms input chunks, and first local speaker playback callback timing.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="32" y="108" fill="#475569">Run</text>
    <text x="330" y="108" fill="#475569">0</text>
    <text x="468" y="108" fill="#475569">500</text>
    <text x="606" y="108" fill="#475569">1000</text>
    <text x="744" y="108" fill="#475569">1500</text>
    <text x="882" y="108" fill="#475569">2000 ms</text>
    <text x="980" y="108" fill="#475569">Result</text>
    <line x1="330" y1="118" x2="940" y2="118" stroke="#cbd5e1"/>
  </g>

  <g stroke="#eef2f7" stroke-width="1">
    <line x1="468" y1="122" x2="468" y2="272"/>
    <line x1="606" y1="122" x2="606" y2="272"/>
    <line x1="744" y1="122" x2="744" y2="272"/>
    <line x1="882" y1="122" x2="882" y2="272"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <text x="32" y="158" fill="#111827">server_vad 200 ms full device</text>
    <rect x="330" y="142" width="352" height="22" rx="3" fill="#15803d" stroke="#052e16" stroke-width="2"/>
    <line x1="717" y1="138" x2="717" y2="168" stroke="#15803d" stroke-width="3"/>
    <text x="980" y="158" fill="#14532d">p50 1275.0, rep 1403.3</text>

    <text x="32" y="210" fill="#111827">forced commit exact endpoint</text>
    <rect x="330" y="194" width="264" height="22" rx="3" fill="#f59e0b"/>
    <line x1="704" y1="190" x2="704" y2="220" stroke="#b45309" stroke-width="3"/>
    <text x="980" y="210" fill="#78350f">p50 957.0, upper bound</text>

    <text x="32" y="262" fill="#111827">p50 opportunity envelope</text>
    <rect x="594" y="246" width="88" height="22" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="980" y="262" fill="#7c2d12">318.0 ms if endpoint is known</text>
  </g>

  <text x="32" y="326" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Decision: do not change the default. Treat this as a target for guarded endpoint anticipation, not current product latency.</text>
</svg>
