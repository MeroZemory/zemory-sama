<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Reference repository landscape</title>
  <desc id="desc">Reference repositories compared by GitHub popularity context and whether a numeric latency harness was available in this run.</desc>
