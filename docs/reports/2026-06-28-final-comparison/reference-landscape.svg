<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="616" viewBox="0 0 1200 616" role="img" aria-labelledby="reference_landscape_title reference_landscape_desc">
  <title id="reference_landscape_title">Reference repository evidence matrix</title>
  <desc id="reference_landscape_desc">Public reference repositories are compared by role, setup result, and whether direct latency evidence exists. They are not ranked by speed.</desc>
  <rect width="1200" height="616" fill="#ffffff"/>
  <text x="32" y="44" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Reference repos: evidence matrix</text>
  <text x="32" y="70" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Names are shown for traceability. Direct latency ranking is intentionally not shown without a common fixture.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="32" y="110" fill="#475569">Project</text>
    <text x="262" y="110" fill="#475569">Primary role</text>
    <text x="550" y="110" fill="#475569">Setup attempt</text>
    <text x="760" y="110" fill="#475569">Latency evidence</text>
    <text x="1000" y="110" fill="#475569">Use in this repo</text>
    <line x1="32" y1="122" x2="1168" y2="122" stroke="#cbd5e1"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <rect x="24" y="136" width="1152" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="164" fill="#111827">realtime-voice-runtime</text>
    <text x="262" y="164" fill="#334155">CLI realtime voice core</text>
    <text x="550" y="164" fill="#166534">pass, warm-cache audit</text>
    <text x="760" y="164" fill="#166534">measured local ablations</text>
    <text x="1000" y="164" fill="#166534">default evidence</text>

    <rect x="24" y="192" width="1152" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="220" fill="#111827">AIRI</text>
    <text x="262" y="220" fill="#334155">large character platform</text>
    <text x="550" y="220" fill="#166534">pass, 201.5s</text>
    <text x="760" y="220" fill="#92400e">no common fixture</text>
    <text x="1000" y="220" fill="#334155">platform layering</text>

    <rect x="24" y="248" width="1152" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="276" fill="#111827">Open-LLM-VTuber</text>
    <text x="262" y="276" fill="#334155">full VTuber app</text>
    <text x="550" y="276" fill="#166534">pass, 28.3s</text>
    <text x="760" y="276" fill="#92400e">no common fixture</text>
    <text x="1000" y="276" fill="#334155">interrupt boundary</text>

    <rect x="24" y="304" width="1152" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="332" fill="#111827">LiveKit Agents</text>
    <text x="262" y="332" fill="#334155">voice agent framework</text>
    <text x="550" y="332" fill="#475569">source review only</text>
    <text x="760" y="332" fill="#92400e">not benchmarked here</text>
    <text x="1000" y="332" fill="#334155">Realtime/VAD check</text>

    <rect x="24" y="360" width="1152" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="388" fill="#111827">RealtimeVoiceChat</text>
    <text x="262" y="388" fill="#334155">cascade voice chat</text>
    <text x="550" y="388" fill="#166534">pass, 33.2s</text>
    <text x="760" y="388" fill="#92400e">different pipeline</text>
    <text x="1000" y="388" fill="#334155">cascade tradeoff</text>

    <rect x="24" y="416" width="1152" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="444" fill="#111827">Neuro</text>
    <text x="262" y="444" fill="#334155">memory/chat VTuber agent</text>
    <text x="550" y="444" fill="#166534">pass, 29.0s</text>
    <text x="760" y="444" fill="#92400e">not latency-core fixture</text>
    <text x="1000" y="444" fill="#334155">memory/context</text>

    <rect x="24" y="472" width="1152" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="500" fill="#111827">AI-Waifu-Vtuber</text>
    <text x="262" y="500" fill="#334155">legacy streaming/chat VTuber</text>
    <text x="550" y="500" fill="#166534">pass, 3.7s</text>
    <text x="760" y="500" fill="#92400e">different model/boundary</text>
    <text x="1000" y="500" fill="#334155">legacy TTS</text>

    <rect x="24" y="528" width="1152" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="556" fill="#111827">AIRIS-VtuberAI</text>
    <text x="262" y="556" fill="#334155">local/GPU VTuber stack</text>
    <text x="550" y="556" fill="#166534">pass, 865.1s</text>
    <text x="760" y="556" fill="#92400e">local/GPU stack</text>
    <text x="1000" y="556" fill="#334155">sentence TTS</text>
  </g>

  <text x="32" y="600" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">Conclusion: external repos inform architecture. realtime-voice-runtime latency claims come only from local numeric artifacts.</text>
</svg>
