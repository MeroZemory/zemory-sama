<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Extreme outlier handling</title>
  <desc id="desc">Raw max values are preserved as diagnostics while representative max values are used for headline comparison.</desc>
  <rect width="980" height="340" fill="#ffffff"/>
  <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Max policy: retain raw max, headline representative max</text>
  <text x="28" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">Extreme network/API stalls are not hidden. They are separated from the headline max when they distort the normal latency envelope.</text>
  <line x1="220" y1="258" x2="900" y2="258" stroke="#cbd5e1"/>
  <text x="220" y="280" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="409" y="280" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">2000</text>
  <text x="604" y="280" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">4000</text>
  <text x="798" y="280" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">6000 ms</text>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <text x="28" y="118" fill="#111827">Manual live session</text>
    <rect x="220" y="100" width="165" height="22" rx="3" fill="#22c55e"/>
    <line x1="908" y1="96" x2="908" y2="126" stroke="#ef4444" stroke-width="4"/>
    <line x1="385" y1="111" x2="908" y2="111" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="397" y="116" fill="#14532d">representative max 1698 ms</text>
    <text x="740" y="95" fill="#991b1b">raw max 7087 ms, 1 outlier</text>

    <text x="28" y="178" fill="#111827">server_vad 200 ms n8</text>
    <rect x="220" y="160" width="147" height="22" rx="3" fill="#84cc16"/>
    <line x1="706" y1="156" x2="706" y2="186" stroke="#ef4444" stroke-width="4"/>
    <line x1="367" y1="171" x2="706" y2="171" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="379" y="176" fill="#365314">representative max 1509 ms</text>
    <text x="570" y="155" fill="#991b1b">raw max 5001 ms, 1 outlier</text>

    <text x="28" y="238" fill="#111827">Controlled say fixture</text>
    <rect x="220" y="220" width="117" height="22" rx="3" fill="#10b981"/>
    <line x1="337" y1="216" x2="337" y2="246" stroke="#047857" stroke-width="4"/>
    <text x="349" y="236" fill="#064e3b">raw max equals representative max 1203 ms</text>
  </g>
  <text x="28" y="312" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">Report rule: use p50 and representative max for comparison, show raw max and outlier count as diagnostics.</text>
</svg>
