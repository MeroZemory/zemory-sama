<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Extreme outlier handling</title>
  <desc id="desc">Raw max values are preserved as diagnostics while representative max values are used for headline comparison.</desc>
  <rect width="1200" height="390" fill="#ffffff"/>
  <text x="32" y="44" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Max policy: retain raw max, compare representative max</text>
  <text x="32" y="70" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Extreme network/API stalls are not hidden; they are separated from the normal latency envelope.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="32" y="108" fill="#475569">Run</text>
    <text x="300" y="108" fill="#475569">0</text>
    <text x="488" y="108" fill="#475569">2000</text>
    <text x="676" y="108" fill="#475569">4000</text>
    <text x="864" y="108" fill="#475569">6000 ms</text>
    <text x="980" y="108" fill="#475569">Diagnostic note</text>
    <text x="948" y="108" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="12">7000</text>
    <line x1="300" y1="118" x2="980" y2="118" stroke="#cbd5e1"/>
  </g>

  <g stroke="#eef2f7" stroke-width="1">
    <line x1="488" y1="122" x2="488" y2="288"/>
    <line x1="676" y1="122" x2="676" y2="288"/>
    <line x1="864" y1="122" x2="864" y2="288"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <text x="32" y="158" fill="#111827">Manual live session</text>
    <rect x="300" y="142" width="160" height="22" rx="3" fill="#22c55e"/>
    <line x1="966" y1="138" x2="966" y2="168" stroke="#ef4444" stroke-width="3"/>
    <text x="980" y="158" fill="#991b1b">rep 1698, raw 7087, 1 outlier</text>

    <text x="32" y="216" fill="#111827">server_vad 200 ms n8</text>
    <rect x="300" y="200" width="142" height="22" rx="3" fill="#22c55e"/>
    <line x1="770" y1="196" x2="770" y2="226" stroke="#ef4444" stroke-width="3"/>
    <text x="980" y="216" fill="#991b1b">rep 1509, raw 5001, 1 outlier</text>

    <text x="32" y="274" fill="#111827">Controlled say fixture</text>
    <rect x="300" y="258" width="113" height="22" rx="3" fill="#22c55e"/>
    <line x1="413" y1="254" x2="413" y2="284" stroke="#047857" stroke-width="3"/>
    <text x="980" y="274" fill="#064e3b">raw max equals representative max 1203</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">
    <rect x="32" y="313" width="20" height="11" rx="2" fill="#22c55e"/>
    <text x="58" y="323">bar = representative max</text>
    <line x1="222" y1="319" x2="242" y2="319" stroke="#ef4444" stroke-width="3"/>
    <text x="248" y="323">line = raw max (diagnostic)</text>
  </g>
  <text x="32" y="348" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Report rule: compare p50 and representative max; still show raw max and outlier count for auditability.</text>
</svg>
