<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Local endpoint tuning rejection</title>
  <desc id="desc">Local endpoint commit tuning compared with server VAD and exact forced commit.</desc>
  <rect width="980" height="450" fill="#ffffff"/>
  <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Local endpoint tuning: faster, but still not the default</text>
  <text x="28" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">Bars show p50 device playback latency. Markers show representative max. Red rows have invalid early-cutoff samples.</text>

  <line x1="310" y1="366" x2="902" y2="366" stroke="#cbd5e1"/>
  <text x="310" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="424" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">500</text>
  <text x="532" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">1000</text>
  <text x="640" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">1500</text>
  <text x="748" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">2000</text>
  <text x="856" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">2500 ms</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="28" y="116" fill="#111827">server_vad default n8</text>
    <rect x="310" y="100" width="275.4" height="22" rx="3" fill="#22c55e"/>
    <line x1="613.1" y1="94" x2="613.1" y2="130" stroke="#15803d" stroke-width="3"/>
    <text x="598" y="116" fill="#14532d">p50 1275.0</text>
    <text x="704" y="116" fill="#14532d">rep max 1403.3</text>

    <text x="28" y="166" fill="#111827">forced commit exact endpoint n8</text>
    <rect x="310" y="150" width="206.7" height="22" rx="3" fill="#f59e0b"/>
    <line x1="602.5" y1="144" x2="602.5" y2="180" stroke="#b45309" stroke-width="3"/>
    <text x="530" y="166" fill="#78350f">p50 957.0</text>
    <text x="626" y="166" fill="#78350f">rep max 1354.2</text>

    <text x="28" y="216" fill="#111827">local endpoint miss10 n4</text>
    <rect x="310" y="200" width="282.8" height="22" rx="3" fill="#ef4444"/>
    <line x1="610.2" y1="194" x2="610.2" y2="230" stroke="#991b1b" stroke-width="3"/>
    <text x="606" y="216" fill="#7f1d1d">p50 1309.2 valid only</text>
    <text x="738" y="216" fill="#7f1d1d">2/4 early cutoff</text>

    <text x="28" y="266" fill="#111827">local endpoint miss14 n8</text>
    <rect x="310" y="250" width="357.3" height="22" rx="3" fill="#60a5fa"/>
    <line x1="751.4" y1="244" x2="751.4" y2="280" stroke="#2563eb" stroke-width="3"/>
    <text x="680" y="266" fill="#1e3a8a">p50 1654.2</text>
    <text x="764" y="266" fill="#1e3a8a">rep max 2043.5</text>

    <text x="28" y="316" fill="#111827">old two-stage local endpoint n4</text>
    <rect x="310" y="300" width="540.0" height="22" rx="3" fill="#93c5fd"/>
    <line x1="902" y1="294" x2="902" y2="330" stroke="#1d4ed8" stroke-width="3"/>
    <text x="738" y="316" fill="#1e3a8a">p50 2940.3 clipped</text>
  </g>

  <rect x="28" y="414" width="14" height="10" fill="#22c55e"/>
  <text x="50" y="423" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">kept default</text>
  <rect x="154" y="414" width="14" height="10" fill="#f59e0b"/>
  <text x="176" y="423" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">upper bound only</text>
  <rect x="302" y="414" width="14" height="10" fill="#60a5fa"/>
  <text x="324" y="423" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">stable but rejected</text>
  <rect x="478" y="414" width="14" height="10" fill="#ef4444"/>
  <text x="500" y="423" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">invalid early cutoff</text>
</svg>
