<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" role="img" aria-label="Speaker output latency benchmark">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="700" fill="#111827">Speaker output latency benchmark</text>
  <text x="260" y="30" font-size="12" fill="#6b7280">dashed line = local target</text>
  <text x="24" y="72" font-size="14" fill="#111827">queue -> playback callback p50</text>
  <rect x="260" y="56" width="202.4" height="22" fill="#0f766e" rx="3"/>
  <line x1="533.3" x2="533.3" y1="52" y2="84" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="472.4" y="72" font-size="13" fill="#111827">7.40 ms</text>
  <text x="24" y="120" font-size="14" fill="#111827">queue -> playback callback rep max</text>
  <rect x="260" y="104" width="227.6" height="22" fill="#0f766e" rx="3"/>
  <line x1="670.0" x2="670.0" y1="100" y2="132" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="497.6" y="120" font-size="13" fill="#111827">8.33 ms</text>
  <text x="24" y="168" font-size="14" fill="#111827">queue -> buffer p50</text>
  <rect x="260" y="152" width="1.5" height="22" fill="#0f766e" rx="3"/>
  <line x1="342.0" x2="342.0" y1="148" y2="180" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="271.5" y="168" font-size="13" fill="#111827">0.06 ms</text>
  <text x="24" y="216" font-size="14" fill="#111827">buffer -> playback p50</text>
  <rect x="260" y="200" width="199.2" height="22" fill="#0f766e" rx="3"/>
  <line x1="533.3" x2="533.3" y1="196" y2="228" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="469.2" y="216" font-size="13" fill="#111827">7.29 ms</text>
</svg>
