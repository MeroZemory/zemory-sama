<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" role="img" aria-label="Turn detection benchmark comparison">
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="24" y="32" font-size="18" font-weight="700" fill="#111827">Turn detection latency comparison</text>
  <text x="250" y="32" font-size="12" fill="#6b7280">bar = p50 source-audio-end to first response audio</text>
  <text x="24" y="76" font-size="14" fill="#111827">semantic_vad high</text>
  <rect x="250" y="58" width="395.8" height="24" fill="#b91c1c" rx="3" />
  <text x="656" y="75" font-size="13" fill="#111827">1885.7 ms</text>
  <text x="24" y="122" font-size="14" fill="#111827">server_vad 300 ms</text>
  <rect x="250" y="104" width="306.7" height="24" fill="#b45309" rx="3" />
  <text x="567" y="121" font-size="13" fill="#111827">1462.7 ms</text>
  <text x="24" y="168" font-size="14" fill="#111827">server_vad 200 ms probe</text>
  <rect x="250" y="150" width="266.4" height="24" fill="#0f766e" rx="3" />
  <text x="527" y="167" font-size="13" fill="#111827">1270.0 ms</text>
  <text x="24" y="214" font-size="14" fill="#111827">server_vad 200 ms full</text>
  <rect x="250" y="196" width="220.5" height="24" fill="#0f766e" rx="3" />
  <text x="482" y="213" font-size="13" fill="#111827">1051.5 ms</text>
  <text x="24" y="258" font-size="13" fill="#6b7280">150 ms and 100 ms were rejected because speech stop fired before the source audio ended.</text>
</svg>
