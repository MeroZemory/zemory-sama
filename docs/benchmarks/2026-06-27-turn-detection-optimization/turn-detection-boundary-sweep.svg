<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" role="img" aria-label="Server VAD boundary sweep">
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="24" y="32" font-size="18" font-weight="700" fill="#111827">Server VAD boundary sweep</text>
  <text x="260" y="32" font-size="12" fill="#6b7280">bar = representative max; rejected rows had early cutoffs</text>
  <text x="24" y="76" font-size="14" fill="#111827">193 ms n8</text>
  <rect x="260" y="58" width="311.1" height="24" fill="#b45309" rx="3" />
  <text x="584" y="75" font-size="13" fill="#111827">1750.0 ms</text>
  <text x="24" y="122" font-size="14" fill="#111827">195 ms n8</text>
  <rect x="260" y="104" width="370.1" height="24" fill="#b91c1c" rx="3" />
  <text x="642" y="121" font-size="13" fill="#111827">2081.8 ms</text>
  <text x="24" y="168" font-size="14" fill="#111827">200 ms n8</text>
  <rect x="260" y="150" width="268.3" height="24" fill="#0f766e" rx="3" />
  <text x="540" y="167" font-size="13" fill="#111827">1509.0 ms</text>
  <text x="24" y="214" font-size="14" fill="#111827">175-192 ms probes</text>
  <rect x="260" y="196" width="160" height="24" fill="#6b7280" rx="3" />
  <text x="432" y="213" font-size="13" fill="#111827">rejected: early cutoff</text>
  <text x="24" y="264" font-size="13" fill="#6b7280">200 ms kept the best representative tail among stable n8 candidates.</text>
  <text x="24" y="288" font-size="13" fill="#6b7280">A 5000.5 ms observed max in the 200 ms n8 run is retained as an extreme diagnostic, not as the headline max.</text>
</svg>
