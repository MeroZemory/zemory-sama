[project]
name = "realtime-voice-runtime"
version = "0.2.0"
description = "Low-latency realtime voice runtime for AI agents and VTuber systems"
requires-python = ">=3.12"
dependencies = [
    "openai[realtime]>=2.31.0,<3",
    "sounddevice>=0.5.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "onnxruntime>=1.18.0",
    "silero-vad>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
addopts = "--cov=zemory --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/bench_speaker_output.py" = ["E402"]

[tool.coverage.report]
fail_under = 80
show_missing = true
