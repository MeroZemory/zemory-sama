[project]
name = "zemory-sama"
version = "0.2.0"
description = "Low-latency realtime voice conversation AI — optimal design integrating 7 reference projects"
requires-python = ">=3.12"
dependencies = [
    "openai[realtime]>=1.75.0",
    "sounddevice>=0.5.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "onnxruntime>=1.18.0",
    "silero-vad>=6.2.1",
    "duckduckgo-search>=7.0.0",
]

[project.optional-dependencies]
observability = ["aiohttp>=3.9"]
memory = ["chromadb>=0.5,<0.6", "sentence-transformers>=3.0"]
chat = ["pytchat>=0.5"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
